Name: Deploy Image

on:
  workflow_dispatch: # 手動でビルド開始

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Packageへの書き込み権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
  
          tags: |
            ghcr.io/${{ github.repository_owner }}/v-suite:latest

      - name: Summary
        run: |
          echo "Image successfully pushed to ghcr.io/${{ github.repository_owner }}/v-suite:latest"
